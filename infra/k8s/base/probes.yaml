apiVersion: v1
kind: Pod
metadata:
  name: consolidahub-api-probes-example
  namespace: default
  labels:
    app: consolidahub
    component: api
spec:
  containers:
    - name: api
      image: consolidahub/api:latest
      ports:
        - containerPort: 3000
          name: http
      livenessProbe:
        httpGet:
          path: /api/v1/health/live
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /api/v1/health/ready
          port: http
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      startupProbe:
        httpGet:
          path: /api/v1/health/startup
          port: http
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 3
        failureThreshold: 30
