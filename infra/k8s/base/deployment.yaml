apiVersion: apps/v1
kind: Deployment
metadata:
  name: consolidahub-api
  labels:
    app: consolidahub
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: consolidahub
      component: api
  template:
    metadata:
      labels:
        app: consolidahub
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: consolidahub-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: consolidahub/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: consolidahub-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: consolidahub-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: consolidahub-config
              key: LOG_LEVEL
        - name: CORS_ORIGIN_1
          valueFrom:
            configMapKeyRef:
              name: consolidahub-config
              key: CORS_ORIGIN_1
        - name: CORS_ORIGIN_2
          valueFrom:
            configMapKeyRef:
              name: consolidahub-config
              key: CORS_ORIGIN_2
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: consolidahub-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: consolidahub-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: consolidahub-secrets
              key: JWT_SECRET
        - name: ENTRA_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: consolidahub-secrets
              key: ENTRA_TENANT_ID
        - name: ENTRA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: consolidahub-secrets
              key: ENTRA_CLIENT_ID
        - name: ENTRA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: consolidahub-secrets
              key: ENTRA_CLIENT_SECRET
        - name: ENTRA_AUTHORITY
          valueFrom:
            secretKeyRef:
              name: consolidahub-secrets
              key: ENTRA_AUTHORITY
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/v1/health/startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - consolidahub
              topologyKey: kubernetes.io/hostname
