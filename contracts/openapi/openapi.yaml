components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Autenticação via JWT. Obtenha o token fazendo login em `/auth/login`.
        Inclua o token no header: `Authorization: Bearer <seu-token>`

  schemas:
    # Common Schemas
    Pagination:
      $ref: './schemas/common.yaml#/Pagination'
    SuccessResponse:
      $ref: './schemas/common.yaml#/SuccessResponse'
    SuccessPaginatedResponse:
      $ref: './schemas/common.yaml#/SuccessPaginatedResponse'
    ErrorResponse:
      $ref: './schemas/common.yaml#/ErrorResponse'
    Timestamp:
      $ref: './schemas/common.yaml#/Timestamp'
    UUID:
      $ref: './schemas/common.yaml#/UUID'

    # Auth Schemas
    LoginRequest:
      $ref: './schemas/auth.yaml#/LoginRequest'
    LoginResponse:
      $ref: './schemas/auth.yaml#/LoginResponse'
    UserProfile:
      $ref: './schemas/auth.yaml#/UserProfile'
    RefreshTokenRequest:
      $ref: './schemas/auth.yaml#/RefreshTokenRequest'
    LogoutResponse:
      $ref: './schemas/auth.yaml#/LogoutResponse'

    # User Schemas
    User:
      $ref: './schemas/users.yaml#/User'
    CreateUserRequest:
      $ref: './schemas/users.yaml#/CreateUserRequest'
    UpdateUserRequest:
      $ref: './schemas/users.yaml#/UpdateUserRequest'
    ChangePasswordRequest:
      $ref: './schemas/users.yaml#/ChangePasswordRequest'
    UserListResponse:
      $ref: './schemas/users.yaml#/UserListResponse'

    # Permission Schemas
    Permission:
      $ref: './schemas/permissions.yaml#/Permission'
    RolePermission:
      $ref: './schemas/permissions.yaml#/RolePermission'
    GrantPermissionRequest:
      $ref: './schemas/permissions.yaml#/GrantPermissionRequest'
    RevokePermissionRequest:
      $ref: './schemas/permissions.yaml#/RevokePermissionRequest'
    Role:
      $ref: './schemas/permissions.yaml#/Role'

    # Rule Schemas
    Rule:
      $ref: './schemas/rules.yaml#/Rule'
    CreateRuleRequest:
      $ref: './schemas/rules.yaml#/CreateRuleRequest'
    UpdateRuleRequest:
      $ref: './schemas/rules.yaml#/UpdateRuleRequest'
    RuleVersion:
      $ref: './schemas/rules.yaml#/RuleVersion'
    RuleListResponse:
      $ref: './schemas/rules.yaml#/RuleListResponse'

    # Source Schemas
    Source:
      $ref: './schemas/sources.yaml#/Source'
    CreateSourceRequest:
      $ref: './schemas/sources.yaml#/CreateSourceRequest'
    UpdateSourceRequest:
      $ref: './schemas/sources.yaml#/UpdateSourceRequest'
    SourceHealth:
      $ref: './schemas/sources.yaml#/SourceHealth'
    SourceTestRequest:
      $ref: './schemas/sources.yaml#/SourceTestRequest'
    SourceTestResponse:
      $ref: './schemas/sources.yaml#/SourceTestResponse'

    # Execution Schemas
    Execution:
      $ref: './schemas/executions.yaml#/Execution'
    ExecutionRequest:
      $ref: './schemas/executions.yaml#/ExecutionRequest'
    ExecutionResponse:
      $ref: './schemas/executions.yaml#/ExecutionResponse'
    ExecutionListResponse:
      $ref: './schemas/executions.yaml#/ExecutionListResponse'
    ExecutionStats:
      $ref: './schemas/executions.yaml#/ExecutionStats'
    CancelExecutionRequest:
      $ref: './schemas/executions.yaml#/CancelExecutionRequest'

    # Report Schemas
    Report:
      $ref: './schemas/reports.yaml#/Report'
    CreateReportRequest:
      $ref: './schemas/reports.yaml#/CreateReportRequest'
    UpdateReportRequest:
      $ref: './schemas/reports.yaml#/UpdateReportRequest'
    GenerateReportRequest:
      $ref: './schemas/reports.yaml#/GenerateReportRequest'
    ReportListResponse:
      $ref: './schemas/reports.yaml#/ReportListResponse'
    ReportSchedule:
      $ref: './schemas/reports.yaml#/ReportSchedule'

    # Notification Schemas
    Notification:
      $ref: './schemas/notifications.yaml#/Notification'
    CreateNotificationRequest:
      $ref: './schemas/notifications.yaml#/CreateNotificationRequest'
    MarkAsReadRequest:
      $ref: './schemas/notifications.yaml#/MarkAsReadRequest'
    NotificationPreferences:
      $ref: './schemas/notifications.yaml#/NotificationPreferences'
    NotificationListResponse:
      $ref: './schemas/notifications.yaml#/NotificationListResponse'
    BulkMarkAsReadRequest:
      $ref: './schemas/notifications.yaml#/BulkMarkAsReadRequest'

