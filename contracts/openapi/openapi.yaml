          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
            enum: [AVAILABLE, GENERATING, FAILED]
        - in: query
          name: format
          schema:
            type: string
            enum: [PDF, CSV, XLSX, JSON]
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [generatedAt]
