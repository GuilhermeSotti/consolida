Source:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 255
    type:
      type: string
      enum:
        - CSV
        - XLSX
        - DATABASE
        - API
    status:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    description:
      type: string
      nullable: true
    config:
      type: object
      description: Configuração específica do tipo de fonte
    lastSync:
      type: string
      format: date-time
      nullable: true
    createdBy:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - id
    - name
    - type
    - status
    - config
    - createdBy
    - createdAt

CreateSourceRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    type:
      type: string
      enum:
        - CSV
        - XLSX
        - DATABASE
        - API
    description:
      type: string
      nullable: true
    config:
      type: object
      description: Configuração específica (ex: conexão BD, endpoint API, etc)
    status:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
      default: ACTIVE
  required:
    - name
    - type
    - config

UpdateSourceRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    description:
      type: string
      nullable: true
    config:
      type: object
    status:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

SourceHealth:
  type: object
  properties:
    sourceId:
      type: string
      format: uuid
    status:
      type: string
      enum:
        - HEALTHY
        - DEGRADED
        - UNREACHABLE
    lastCheck:
      type: string
      format: date-time
    message:
      type: string
      nullable: true
  required:
    - sourceId
    - status
    - lastCheck

SourceTestRequest:
  type: object
  properties:
    type:
      type: string
      enum:
        - CSV
        - XLSX
        - DATABASE
        - API
    config:
      type: object
  required:
    - type
    - config

SourceTestResponse:
  type: object
  properties:
    success:
      type: boolean
    message:
      type: string
    rowCount:
      type: integer
      nullable: true
  required:
    - success
    - message
